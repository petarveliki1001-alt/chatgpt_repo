name: Windows desktop release
on:
  workflow_dispatch:
  push:
    branches: [memoirs-v0.1.37]
    paths:
      - 'PersonalMemoirsReader/**'
      - 'NativeSpeech/**'
      - 'NativeSpeech.Tests/**'
      - 'PocketWorker/**'
      - 'MemoirsReader.sln'
      - 'README.md'
      - 'tools/package-release.ps1'
      - '.github/workflows/desktop-release.yml'
permissions:
  contents: write
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Package source and build the exact extracted delivery
        shell: pwsh
        run: |
          tools/package-release.ps1
          Expand-Archive downloads/MemoirsReader_v0.1.37.zip artifacts/extracted
          Set-Location artifacts/extracted/MemoirsReader_v0.1.37
          dotnet build MemoirsReader.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project NativeSpeech.Tests -c Release -- NativeSpeech/models.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'PersonalMemoirsReader/bin/Release/net8.0-windows/SpeechWorker/PocketWorker.exe')) { throw 'Native worker was not copied by the normal Visual Studio build.' }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/memoirs-models
          key: native-desktop-models-${{ hashFiles('NativeSpeech/models.json') }}
          restore-keys: |
            native-desktop-models-
      - name: Verify speech models without Python or ASR
        shell: pwsh
        run: |
          $models = Join-Path $env:RUNNER_TEMP 'memoirs-models'
          Set-Location artifacts/extracted/MemoirsReader_v0.1.37
          foreach ($engine in @('chatterbox','f5','pocket')) {
            dotnet run --project NativeSpeech.Tests -c Release -- install $engine $models NativeSpeech/models.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Invoke-WebRequest 'https://raw.githubusercontent.com/SWivid/F5-TTS/main/src/f5_tts/infer/examples/basic/basic_ref_en.wav' -OutFile "$models/reference.wav"
          if ((Get-FileHash "$models/reference.wav" -Algorithm SHA256).Hash -ne 'b0e22048e72414fcc1e6b6342e47a774d748a195ed34e4a5b3fcf416707f2b71') { throw 'Reference fixture checksum mismatch.' }
      - name: Exercise actual WinForms generation and reuse
        shell: pwsh
        run: |
          $models = Join-Path $env:RUNNER_TEMP 'memoirs-models'
          $results = Join-Path $env:GITHUB_WORKSPACE 'verification/results/desktop-v0.1.37'
          $exe = Resolve-Path 'artifacts/extracted/MemoirsReader_v0.1.37/PersonalMemoirsReader/bin/Release/net8.0-windows/MemoirsReader.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke',"`"$models`"","`"$models/reference.wav`"","`"$results`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$results/failure.txt") {
              $message = (Get-Content "$results/failure.txt" -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Desktop smoke diagnostic::$message"
            }
            throw "Desktop smoke exit: $($process.ExitCode)"
          }
          if (!(Test-Path "$results/desktop-smoke.json")) { throw 'Desktop test produced no results.' }
          Get-Content "$results/desktop-smoke.json"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemoirsReader-v0.1.37-validation
          path: verification/results/desktop-v0.1.37/
      - name: Save tested source delivery
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/MemoirsReader_v0.1.37.zip verification/results/desktop-v0.1.37/desktop-smoke.json verification/results/desktop-v0.1.37/form.png
          git commit -m 'Deliver Windows-checked Memoirs Reader v0.1.37 source ZIP [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:memoirs-v0.1.37
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
